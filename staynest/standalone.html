      }, [reviews]);

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchName = pg.name.toLowerCase().includes(q);
          const matchArea = pg.area.toLowerCase().includes(q);
          const matchCity = pg.city.toLowerCase().includes(q);
          const matchCol = pg.nearbyColleges.some(c => c.collegeName.toLowerCase().includes(q));
          if (!matchName && !matchArea && !matchCity && !matchCol) return false;
        }

        if (selectedCollegeId !== 'all') {
          const colDist = pg.nearbyColleges.find(c => c.collegeId === selectedCollegeId);
          if (!colDist) return false;
          if (maxDistanceKm < 20 && colDist.distanceKm > maxDistanceKm) return false;
        }

        if (genderType !== 'all' && pg.genderType !== genderType && pg.genderType !== 'unisex') return false;

        if (selectedFacilities.length > 0 && !selectedFacilities.every(f => pg.facilities.includes(f))) return false;

        return true;

        if (sortBy === 'rent_low') return a.rentPerMonth - b.rentPerMonth;
        if (sortBy === 'rent_high') return b.rentPerMonth - a.rentPerMonth;

                            <span className="text-xs font-bold text-amber-800">⭐ {pg.rating}</span>
                          </div>
                          <h3 className="font-extrabold text-slate-900 text-base">{pg.name}</h3>
                          <p className="text-xs text-slate-500">📍 {pg.address}, {pg.area}</p>
                          <div className="flex justify-between items-baseline pt-2 border-t border-slate-100">
                            <span className="text-lg font-extrabold text-sky-700">₹{pg.rentPerMonth}/mo</span>
                            <button onClick={() => setSelectedPGDetails(pg)} className="px-3 py-1.5 bg-sky-600 text-white font-bold text-xs rounded-lg">View Details</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'pgs' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                <div className="p-6 bg-slate-900 text-white rounded-3xl flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-extrabold">{selectedCollege ? selectedCollege.name : 'All Colleges & Cities'}</h1>
                    <p className="text-xs text-slate-300">Showing {filteredPGs.length} verified PG accommodations</p>
                  </div>
                  <span className="px-3 py-1 bg-white/10 rounded-xl text-xs font-bold">{filteredPGs.length} PGs</span>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* Sidebar Filters */}
                  <div className="lg:col-span-3 bg-white p-4 rounded-2xl border border-slate-200 space-y-4 text-xs">
                    <h3 className="font-bold text-slate-900 text-sm">Filters</h3>
                    <div>
                      <label className="font-semibold block mb-1">Max Rent Budget: ₹{maxRent}</label>
                      <input type="range" min="3000" max="30000" step="1000" value={maxRent} onChange={e => setMaxRent(Number(e.target.value))} className="w-full accent-sky-600" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Gender</label>
                      <select value={genderType} onChange={e => setGenderType(e.target.value)} className="w-full p-2 border rounded font-medium">
                        <option value="all">All Genders</option>
                        <option value="boys">Boys</option>
                        <option value="girls">Girls</option>
                        <option value="unisex">Unisex</option>
                      </select>
                    </div>
                  </div>

                  {/* Grid */}
                  <div className="lg:col-span-9 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {filteredPGs.map(pg => (
                      <div key={pg.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md">
                        <img src={pg.photos[0]} className="w-full h-40 object-cover" />
                        <div className="p-4 space-y-2">
                          <h3 className="font-extrabold text-slate-900 text-sm line-clamp-1">{pg.name}</h3>
                          <p className="text-xs text-slate-500">📍 {pg.area}, {pg.city}</p>
                          <div className="flex justify-between items-baseline pt-2 border-t border-slate-100">
                            <span className="text-base font-extrabold text-sky-700">₹{pg.rentPerMonth}/mo</span>
                            <button onClick={() => setSelectedPGDetails(pg)} className="px-3 py-1 bg-sky-600 text-white font-bold text-xs rounded-lg">Details</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'colleges' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900">Educational Campuses Across India</h1>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  {colleges.map(c => (
                    <div key={c.id} onClick={() => { setSelectedCollegeId(c.id); setActiveTab('pgs'); }} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer flex items-center gap-4">
                      <img src={c.image} className="w-16 h-16 rounded-xl object-cover" />
                      <div>
                        <h3 className="font-bold text-slate-900">{c.name}</h3>
                        <p className="text-xs text-slate-500">{c.city}, {c.state}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-8 px-4 text-center text-xs space-y-2 border-t border-slate-800">
            <p className="font-extrabold text-white text-sm">StayNest Student PG Accommodation Finder</p>
            <p>© 2026 Academic Community Project. Designed for students across India.</p>
          </footer>

          {/* PG Details Modal */}
          {selectedPGDetails && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="text-xl font-extrabold text-slate-900">{selectedPGDetails.name}</h2>
                  <button onClick={() => setSelectedPGDetails(null)} className="text-slate-400 text-xl font-bold">✕</button>
                </div>
                <img src={selectedPGDetails.photos[0]} className="w-full h-56 object-cover rounded-2xl" />
                <div className="space-y-2 text-xs">
                  <p className="text-slate-600"><strong>Address:</strong> {selectedPGDetails.address}, {selectedPGDetails.area}, {selectedPGDetails.city}</p>
                  <p className="text-sky-700 font-bold text-lg">₹{selectedPGDetails.rentPerMonth} / month (Deposit: ₹{selectedPGDetails.securityDeposit})</p>
                  <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                    <p className="font-bold text-slate-800">Owner Contact:</p>
                    <p>Name: {selectedPGDetails.ownerName}</p>
                    <p className="text-sky-600 font-bold">Phone: {selectedPGDetails.ownerPhone}</p>
                  </div>
                  <div className="p-3 bg-emerald-50 rounded-xl text-emerald-900 font-bold">
                    🟢 Verified PG Status — Approved by Administrator
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Add PG Modal */}
          {showAddPGModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h2 className="text-base font-bold text-slate-900">Add Your PG (Owner Registration)</h2>
                  <button onClick={() => setShowAddPGModal(false)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={e => {
                  e.preventDefault();
                  alert('Thank you! Your PG has been submitted with status: 🟡 Pending Verification. Admin will review before publishing.');
                  setShowAddPGModal(false);
                }} className="space-y-3 text-xs">
                  <input required placeholder="Owner Name" className="w-full p-2 border rounded" />
                  <input required placeholder="Phone Number" className="w-full p-2 border rounded" />
                  <input required placeholder="PG Name" className="w-full p-2 border rounded" />
                  <input required placeholder="Monthly Rent (₹)" type="number" className="w-full p-2 border rounded" />
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl">Submit for Verification</button>
                </form>
              </div>
            </div>
          )}

          {/* Docs Modal */}
          {showDocModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h2 className="text-base font-bold text-slate-900">Academic Project Documentation (20 Sections)</h2>
                  <button onClick={() => setShowDocModal(false)} className="text-slate-400">✕</button>
                </div>
                <div className="space-y-4 text-slate-800">
                  <h3 className="font-bold text-sm text-sky-700">StayNest — Student PG Finder</h3>
                  <p>1. Project Title: StayNest Multi-College Accommodation Finder</p>
                  <p>2. Objectives: Connect outstation college students with verified PGs near campus.</p>
                  <p>3. Features: College-based search, verified badges, owner portal, admin moderation queue.</p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StayNestApp />);
  </script>
</body>
</html>
