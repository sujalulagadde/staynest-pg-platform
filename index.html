    // --- LEAFLET MAP VISUALIZER ---
    function MapViewComponent({ pg, college }) {
      const mapRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current || !window.L) return;

        try {
          if (instanceRef.current) {
            instanceRef.current.remove();
          }

          const centerLat = pg ? pg.lat : (college ? college.lat : 18.6517);
          const centerLng = pg ? pg.lng : (college ? college.lng : 73.7616);

          const map = L.map(mapRef.current).setView([centerLat, centerLng], 14);
          instanceRef.current = map;

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          if (college) {
            const colIcon = L.divIcon({
              className: 'col-marker',
              html: `<div style="background:#034ea2; color:white; padding:4px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid white;">🎓 ${college.code}</div>`
            });
            L.marker([college.lat, college.lng], { icon: colIcon }).addTo(map).bindPopup(`<b>${college.name}</b>`);
          }

          if (pg) {
            const pgIcon = L.divIcon({
              className: 'pg-marker',
              html: `<div style="background:#059669; color:white; padding:4px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid white;">🏠 ${pg.name}</div>`
            });
            L.marker([pg.lat, pg.lng], { icon: pgIcon }).addTo(map).bindPopup(`<b>${pg.name}</b><br/>₹${pg.rentPerMonth}/mo`);
          }

        } catch (e) {
          console.log('Map note:', e);
        }
      }, [pg, college]);

      return <div ref={mapRef} className="w-full h-64 rounded-2xl overflow-hidden border border-slate-200" />;
    }

                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block">Room Sharing</span>
                    <span className="text-base font-bold capitalize text-slate-900">{selectedPGDetails.sharingTypes.join(', ')}</span>
                  </div>
                </div>

                <div className="p-4 bg-sky-50 rounded-2xl border border-sky-200 space-y-2 text-xs">
                  <h4 className="font-bold text-sky-950 text-sm">Owner Contact Details</h4>
                  <p className="text-slate-800 font-semibold">Owner Name: <span className="font-bold">{selectedPGDetails.ownerName}</span></p>
                  <p className="text-sky-700 font-extrabold text-sm">Phone: <a href={`tel:${selectedPGDetails.ownerPhone}`} className="hover:underline">{selectedPGDetails.ownerPhone}</a></p>
                  {selectedPGDetails.googleMapUrl && (
                    <a href={selectedPGDetails.googleMapUrl} target="_blank" className="text-sky-600 font-bold hover:underline block pt-1">
                      🗺️ View Location on Google Maps →
                    </a>
                  )}
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 text-sm mb-2">Map Location:</h4>
                  <MapViewComponent pg={selectedPGDetails} college={selectedCollege} />
                </div>
              </div>
            </div>
          )}

          {/* FULL FEATURED PG OWNER ADD PG MODAL */}
          {showAddPGModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl border">
                
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="text-lg font-bold text-slate-900">📷 Add Your PG Property (Owner Submission)</h2>
                  <button onClick={() => { setShowAddPGModal(false); setFormSubmitted(false); }} className="text-slate-400 font-bold text-xl">✕</button>
                </div>

                {formSubmitted ? (
                  <div className="p-6 text-center space-y-3">
                    <div className="w-12 h-12 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center text-xl font-bold mx-auto">🟡</div>
                    <h3 className="text-xl font-bold text-slate-900">Submission Sent to Admin for Verification!</h3>
                    <p className="text-xs text-slate-600 bg-amber-50 p-4 rounded-xl border border-amber-200">
                      Your PG property <strong>"{pgName}"</strong> with <strong>{uploadedPhotos.length} photo(s)</strong> has been logged with status: <strong>🟡 Pending Admin Verification</strong>.<br/>
                      The PCCOE Admin (<code>staynest.pccoe</code> / <code>sujal.pccoe</code>) will review your PG photos, address, and rent in the Admin Portal before granting the 🟢 Verified badge for students to view!
                    </p>
                    <button onClick={() => { setShowAddPGModal(false); setFormSubmitted(false); }} className="px-6 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">Done</button>
                  </div>
                ) : (
                  <form onSubmit={handleOwnerSubmit} className="space-y-4 text-xs">
                    
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">1. PG Basics & Gender</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input required placeholder="PG Name (e.g. Royal Luxury PG) *" value={pgName} onChange={e => setPgName(e.target.value)} className="p-2 border rounded bg-white font-bold sm:col-span-2" />
                        <select value={pgGender} onChange={e => setPgGender(e.target.value)} className="p-2 border rounded bg-white font-bold">
                          <option value="boys">Boys PG</option>
                          <option value="girls">Girls PG</option>
                          <option value="unisex">Unisex Co-Living</option>
                        </select>
                      </div>
                      <input placeholder="Tagline / Short description" value={pgTagline} onChange={e => setPgTagline(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-0.5">Owner / Host Display Name (Shown to Students)</label>
                          <input placeholder="Owner Name or Business Name (e.g. StayNest Host)" value={customOwnerName} onChange={e => setCustomOwnerName(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-sky-800" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-0.5">Owner Contact Mobile No. / Phone Number *</label>
                          <input required placeholder="e.g. +91 98220 12345" value={ownerPhoneInput} onChange={e => setOwnerPhoneInput(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-slate-900" />
                        </div>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">📍 Nearest College Campus & Distance</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-0.5">Nearest College Campus *</label>
                          <select value={nearestCollegeId} onChange={e => setNearestCollegeId(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-slate-900">
                            {colleges.map(c => <option key={c.id} value={c.id}>{c.name} ({c.city})</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-0.5">Distance from College (in KM) *</label>
                          <input type="number" step="0.1" min="0.1" max="50" required placeholder="e.g. 0.6" value={distanceKmInput} onChange={e => setDistanceKmInput(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-emerald-800" />
                        </div>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">2. Full Address & Google Maps Link</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input required placeholder="City *" value={pgCity} onChange={e => setPgCity(e.target.value)} className="p-2 border rounded bg-white" />
                        <input required placeholder="Area / Locality *" value={pgArea} onChange={e => setPgArea(e.target.value)} className="p-2 border rounded bg-white" />
                        <input required placeholder="Pincode *" value={pgPincode} onChange={e => setPgPincode(e.target.value)} className="p-2 border rounded bg-white" />
                      </div>
                      <input required placeholder="Full Street Address *" value={pgAddress} onChange={e => setPgAddress(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input placeholder="Google Maps Share Link URL" value={googleMapUrl} onChange={e => setGoogleMapUrl(e.target.value)} className="w-full p-2 border rounded bg-white" />
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">3. Monthly Rent, Deposit & Bed Availability</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Monthly Rent (₹)</label>
                          <input type="number" required value={rentPerMonth} onChange={e => setRentPerMonth(e.target.value)} className="w-full p-2 border rounded font-bold" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Security Deposit (₹)</label>
                          <input type="number" required value={securityDeposit} onChange={e => setSecurityDeposit(e.target.value)} className="w-full p-2 border rounded font-bold" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Total Beds</label>
                          <input type="number" required value={totalBeds} onChange={e => setTotalBeds(e.target.value)} className="w-full p-2 border rounded" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Available Beds</label>
                          <input type="number" required value={availableBeds} onChange={e => setAvailableBeds(e.target.value)} className="w-full p-2 border rounded font-bold text-emerald-700" />
                        </div>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">4. Facilities Provided</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                        {ALL_FACILITIES.map(fac => (
                          <label key={fac} className="flex items-center gap-1.5 p-1.5 bg-white border rounded">
                            <input
                              type="checkbox"
                              checked={pgFacilities.includes(fac)}
                              onChange={() => {
                                setPgFacilities(prev => prev.includes(fac) ? prev.filter(f => f !== fac) : [...prev, fac]);
                              }}
                              className="w-3.5 h-3.5 text-emerald-600"
                            />
                            <span>{fac}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* PHOTO UPLOADER */}
                    <div className="p-4 bg-sky-50 rounded-2xl border border-sky-200 space-y-3">
                      <h4 className="font-bold uppercase text-sky-950 text-xs">📷 5. PG Photos Uploader ({uploadedPhotos.length} Added)</h4>
                      <div className="p-4 bg-white border-2 border-dashed border-sky-300 rounded-xl text-center">
                        <input type="file" accept="image/*" multiple onChange={handleFileUpload} className="hidden" id="pg-photo-input-modal" />
                        <label htmlFor="pg-photo-input-modal" className="cursor-pointer flex flex-col items-center gap-1">
                          <span className="text-2xl">📁</span>
                          <span className="font-bold text-sky-700 text-xs">Click to Choose Photos from Laptop / Phone</span>
                          <span className="text-[10px] text-slate-400">Supports JPG, PNG, WEBP files</span>
                        </label>
                      </div>

                      {uploadedPhotos.length > 0 && (
                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 pt-2">
                          {uploadedPhotos.map((photo, index) => (
                            <div key={index} className="relative rounded-xl overflow-hidden border bg-slate-900 h-20">
                              <img src={photo} className="w-full h-full object-cover" />
                              <button type="button" onClick={() => handleRemovePhoto(index)} className="absolute top-1 right-1 bg-rose-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold">✕</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md">
                      Submit PG Property for Admin Verification
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* PROJECT DOCS MODAL */}
          {showDocModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 space-y-4 max-h-[88vh] overflow-y-auto shadow-2xl border text-xs">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="text-base font-bold text-slate-900">Academic Project Documentation (20 Sections)</h2>
                  <button onClick={() => setShowDocModal(false)} className="text-slate-400 font-bold text-xl">✕</button>
                </div>
                <div className="space-y-3 text-slate-800">
                  <h3 className="font-bold text-sm text-sky-700">StayNest — Student PG Accommodation Finder</h3>
                  <p><strong>1. Title:</strong> StayNest General-Purpose College PG Accommodation Finder</p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StayNestApp />);
  </script>
</body>
</html>
